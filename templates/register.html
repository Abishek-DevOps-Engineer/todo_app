{% extends "base.html" %}
{% block title %}Create Account — Taska{% endblock %}

{% block content %}
<div class="auth-layout auth-layout--register">
    <div class="auth-panel auth-panel--deco auth-panel--deco-alt">
        <div class="deco-content">
            <div class="deco-logo">T</div>
            <h1 class="deco-headline">Build habits.<br>Clear your<br>mind.</h1>
            <div class="deco-pills">
                <span class="pill">📋 Organize</span>
                <span class="pill">✅ Complete</span>
                <span class="pill">🎯 Focus</span>
                <span class="pill">🚀 Ship</span>
            </div>
            <div class="deco-tag">Free forever. No credit card.</div>
        </div>
    </div>

    <div class="auth-panel auth-panel--form">
        <div class="form-container">
            <div class="form-header">
                <h2 class="form-title">Create account</h2>
                <p class="form-subtitle">Start organizing in seconds</p>
            </div>

            <form class="auth-form" method="POST" action="{{ url_for('register') }}">
                <div class="field">
                    <label class="field__label" for="username">Username</label>
                    <input
                        class="field__input"
                        type="text"
                        id="username"
                        name="username"
                        placeholder="johndoe"
                        required
                        minlength="3"
                        autocomplete="username"
                    >
                </div>

                <div class="field">
                    <label class="field__label" for="email">Email</label>
                    <input
                        class="field__input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="field">
                    <label class="field__label" for="password">Password</label>
                    <div class="field__input-wrap">
                        <input
                            class="field__input"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Min. 6 characters"
                            required
                            minlength="6"
                            autocomplete="new-password"
                        >
                        <button type="button" class="toggle-pw" data-target="password" aria-label="Toggle password">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div class="strength-bar"><div class="strength-bar__fill" id="strengthFill"></div></div>
                </div>

                <div class="field">
                    <label class="field__label" for="confirm_password">Confirm Password</label>
                    <div class="field__input-wrap">
                        <input
                            class="field__input"
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Repeat your password"
                            required
                            autocomplete="new-password"
                        >
                        <button type="button" class="toggle-pw" data-target="confirm_password" aria-label="Toggle password">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button class="btn-primary" type="submit">Create Account</button>
            </form>

            <p class="form-footer">
                Already have an account?
                <a href="{{ url_for('login') }}">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
