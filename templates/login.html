{% extends "base.html" %}
{% block title %}Sign In — Taska{% endblock %}

{% block content %}
<div class="auth-layout">
    <div class="auth-panel auth-panel--deco">
        <div class="deco-content">
            <div class="deco-logo">T</div>
            <h1 class="deco-headline">Every great<br>day starts<br>with a list.</h1>
            <div class="deco-dots">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
            </div>
            <div class="deco-tag" id="rotating-quote">Your tasks. Your flow.</div>
        </div>
    </div>

    <div class="auth-panel auth-panel--form">
        <div class="form-container">
            <div class="form-header">
                <h2 class="form-title">Welcome back</h2>
                <p class="form-subtitle">Sign in to your workspace</p>
            </div>

            <form class="auth-form" method="POST" action="{{ url_for('login') }}">
                <div class="field">
                    <label class="field__label" for="email">Email</label>
                    <input
                        class="field__input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="field">
                    <label class="field__label" for="password">
                        Password
                        <a href="#" class="field__link">Forgot?</a>
                    </label>
                    <div class="field__input-wrap">
                        <input
                            class="field__input"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-pw" data-target="password" aria-label="Toggle password">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button class="btn-primary" type="submit">Sign In</button>
            </form>

            <p class="form-footer">
                Don't have an account?
                <a href="{{ url_for('register') }}">Create one</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
